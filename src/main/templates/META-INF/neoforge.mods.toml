# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# TFC Collection Advancements
[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "TFC Collection Advancements"
    credits = "Adds addon items to collection advancements"
    authors = "yazloysasha"
    description = '''A simple mod that adds items from addons to TerraFirmaCraft collection advancements.'''
    displayTest = "MATCH_VERSION"

# Dependencies
[[dependencies.${modId}]]
    modId = "tfc"
    type = "required"
    versionRange = "${tfcVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "afc"
    type = "optional"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "beneath"
    type = "optional"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"
