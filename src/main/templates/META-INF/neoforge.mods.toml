# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# ArborFirmaCraft Advancement
[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "ArborFirmaCraft Advancement"
    credits = "Extends the sapling-finding advancement with every ArborFirmaCraft tree"
    authors = "yazloysasha"
    description = '''Adds all trees from ArborFirmaCraft to the sapling-finding advancement.'''
    displayTest = "MATCH_VERSION"

# Dependencies
[[dependencies.${modId}]]
    modId = "afc"
    type = "required"
    versionRange = "${afcVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"
