# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# TFC: Completist
[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "TFC: Completist"
    credits = "New TFC collection advancements, and the originals finished"
    authors = "yazloysasha"
    description = '''Finally, a TerraFirmaCraft you can finish. New collection advancements - plus the originals, grown with your addons and stripped of their bugs.'''
    displayTest = "MATCH_VERSION"

# Dependencies
[[dependencies.${modId}]]
    modId = "tfc"
    type = "required"
    versionRange = "${tfcVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"
