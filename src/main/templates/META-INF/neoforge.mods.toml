# Loader metadata
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# TFC: Completist
[[mods]]
    modId = "${modId}"
    version = "${modVersion}"
    displayName = "TFC: Completist"
    credits = "Collection advancements that grow with your TFC addons"
    authors = "yazloysasha"
    description = '''TerraFirmaCraft collection advancements that grow with your addons. Every means every - plus the collections TFC never wrote.'''
    displayTest = "MATCH_VERSION"

# Dependencies
[[dependencies.${modId}]]
    modId = "tfc"
    type = "required"
    versionRange = "${tfcVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoForgeVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${modId}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraftVersionRange}"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "${modId}.mixins.json"
